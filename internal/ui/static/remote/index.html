<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VoiceBox">
<title>VoiceBox — пульт</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="remote.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <img src="icon.png" alt="">
    <div><b>VoiceBox</b><small id="conn"><i class="dot"></i><span>подключение…</span></small></div>
  </div>
  <button class="chip" id="fx" type="button" hidden><span class="e"></span><span class="t"></span></button>
</header>
<nav class="tabs" id="tabs" hidden>
  <button type="button" data-tab="sounds" class="on">🔊 Звуки</button>
  <button type="button" data-tab="effects">🎙️ Голос</button>
</nav>
<main id="main"><div class="empty">Загрузка…</div></main>
<footer class="bar">
  <button type="button" class="stop" id="stop"><span class="e">⏹</span><span>Стоп</span></button>
  <button type="button" class="mic" id="mic" hidden><span class="e">🎙️</span><span class="t">Микрофон</span></button>
</footer>
<div class="cover" id="cover" hidden>
  <div class="card">
    <div class="big" id="coverIcon">📡</div>
    <h2 id="coverTitle">Нет связи с компьютером</h2>
    <p id="coverText">Проверьте, что VoiceBox запущен, а телефон подключён к той же сети Wi-Fi, что и компьютер.</p>
    <button type="button" id="retry">Повторить</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script src="remote.js"></script>
</body>
</html>
